<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeAlert - Mapa en Vivo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AizaSyBgInBrapFxzkqamN0As5MjygK_RGOdN1A",
            authDomain: "safealert-14f6f.firebaseapp.com",
            projectId: "safealert-14f6f",
            storageBucket: "safealert-14f6f.firebasestorage.app",
            messagingSenderId: "638562348141",
            appId: "1:638562348141:web:8a9abdcc12daf27d672364"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([0, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = null;

        onSnapshot(doc(db, "ubicaciones_activas", "dispositivo_actual"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const lat = data.latitud;
                const lon = data.longitud;

                if (lat && lon) {
                    if (marker) {
                        marker.setLatLng([lat, lon]);
                    } else {
                        marker = L.marker([lat, lon]).addTo(map);
                    }
                    map.setView([lat, lon], 16);
                }
            }
        });
    </script>
</body>
</html>
</body>
</html>
</html>
